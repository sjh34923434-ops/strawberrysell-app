<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon.png" />
    <title>딸기셀</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0A0F1E; }
      #initial-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 24px;
        background: #0A0F1E;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard Variable', sans-serif;
        z-index: 9999;
        transition: opacity 0.35s ease-out;
      }
      #initial-splash.fade-out { opacity: 0; pointer-events: none; }
      #initial-splash img {
        width: 110px; height: 110px;
        animation: splash-pulse 1.6s ease-in-out infinite;
        filter: drop-shadow(0 8px 28px rgba(99, 102, 241, 0.25));
      }
      #initial-splash .splash-title {
        font-size: 18px; font-weight: 600;
        color: #e2e8f0; letter-spacing: -0.3px;
        margin-bottom: 6px;
      }
      #initial-splash .splash-loading {
        font-size: 13px; letter-spacing: 0.5px;
        display: inline-flex; align-items: baseline;
      }
      #initial-splash .splash-loading::after {
        content: ''; display: inline-block;
        margin-left: 2px; width: 18px; text-align: left;
        animation: splash-dots 1.4s steps(4, end) infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50%      { transform: scale(1.06); opacity: 1; }
      }
      @keyframes splash-dots {
        0%, 20%   { content: ''; }
        40%       { content: '.'; }
        60%       { content: '..'; }
        80%, 100% { content: '...'; }
      }
    </style>
  </head>
  <body>
    <div id="initial-splash">
      <img src="/icon.svg" alt="딸기셀" />
      <div style="display:flex;flex-direction:column;align-items:center;">
        <div class="splash-title">딸기셀</div>
        <div class="splash-loading">로딩 중</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
